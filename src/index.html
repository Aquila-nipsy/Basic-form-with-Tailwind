<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="./output.css" rel="stylesheet">
</head>
<body>
    <form class="flex items-center justify-center min-h-screen bg-blue-100">
        <div class=" flex flex-col bg-white p-8 rounded-lg shadow-md w-full max-w-md "> 
            <label for="username" >Username:</label>
            <input type="text" name="username" placeholder="John Kelvin" class="border border-black-300 rounded-md p-2 mb-4">
            <label for="email">Email:</label>
            <input type="email" name="email" placeholder="name@gmail.com" class="border border-black-300 rounded-md p-2 mb-4">
            <button type="submit" class="bg-blue-500 text-white font-semibold rounded-full p-2 hover:bg-white hover:border border-blue-500 hover:font-semibold hover:text-blue-500 transition duration 300 ease-in">LogIn</button>
        </div>
        </form>
  </h1>
</body>
</html>
